<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad Donation Tracker</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  h1 {
    text-align: center;
    color: #2a7ae2;
  }

  .container {
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  input {
    width: calc(50% - 10px);
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    background: #2a7ae2;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #1954b3;
  }

  ul {
    list-style: none;
    padding-left: 0;
  }

  #message {
  margin-top: 10px;
  font-weight: bold;
  text-align: center;
}

.error {
  color: #ff4d4d;
}

.success {
  color: #28a745;
}

  li {
    background: #f1f3f5;
    margin: 5px 0;
    padding: 10px;
    border-radius: 6px;
  }

  .floating-ipad {
  font-size: 60px;
  text-align: center;
  margin-bottom: 20px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-15px); }
  100% { transform: translateY(0px); }
}

  .total {
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
    font-size: 18px;
    color: #2a7ae2;
  }
</style>
</head>
<body>
  <h1>iPad Donation Tracker</h1>
  <div class="floating-ipad">
    <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="iPad">
      <!-- iPad body -->
      <rect x="13" y="10" width="74" height="80" rx="10" fill="#e0e0e0" stroke="#888" stroke-width="3"/>
      <!-- iPad screen -->
      <rect x="20" y="18" width="60" height="62" rx="5" fill="#fff"/>
      <!-- Home button -->
      <circle cx="50" cy="85" r="3" fill="#bbb"/>
      <!-- Apple logo (centered in screen, more accurate) -->
      <g transform="translate(50,50) scale(1.2)">
        <path d="M2.2-7.5c0.6-0.7,1.1-1.7,0.9-2.7c-0.9,0.1-2,0.6-2.6,1.3c-0.6,0.7-1.2,1.7-0.9,2.6C0.7-6,1.6-6.8,2.2-7.5z" fill="#222"/>

      </g>
    </svg>
  </div>
  <div class="container">
    <input id="name" placeholder="Your Name">
    <input id="amount" placeholder="Amount in USD" type="number" min="50" step="1">
   <button onclick="submitDonation()">Donate</button>
   <div id="message"></div>

    <h2>Donors:</h2>
    <ul id="donorList"></ul>

    <div class="total">Total Raised: $<span id="totalAmount">0</span></div>
  </div>

function submitDonation() {
  const name = document.getElementById('name').value.trim();
  const amountInput = document.getElementById('amount').value.trim();
  const message = document.getElementById('message');

  message.className = "";
  message.textContent = "";

  if (!name) {
    message.textContent = "Please enter your name.";
    message.className = "error";
    return;
  }

  if (!amountInput) {
    message.textContent = "Please enter a number.";
    message.className = "error";
    return;
  }
  if (!/^\d+(\.\d+)?$/.test(amountInput)) {
    message.textContent = "Numbers only please.";
    message.className = "error";
    return;
  }

  const amount = parseFloat(amountInput);

  if (amount < 50) {
    message.textContent = "Only $50 and above allowed, please!";
    message.className = "error";
    return;
  }

  if (amount > 20000 && name !== "Ali Dirani") {
    message.textContent = "Only admins can donate more than 20,000 USD.";
    message.className = "error";
    return;
  }

  db.ref('donations').push({ name, amount: Number(amount) });

  message.textContent = `Thank you, ${name}, for your donation of $${amount}!`;
  message.className = "success";

  document.getElementById('name').value = '';
  document.getElementById('amount').value = '';
}

function renderDonors(snapshot) {
  const list = document.getElementById('donorList');
  const totalEl = document.getElementById('totalAmount');
  let total = 0;
  list.innerHTML = '';
  snapshot.forEach(child => {
    const val = child.val();
    total += parseFloat(val.amount || 0);
    const li = document.createElement('li');
    li.textContent = `${val.name} will donate $${val.amount}`;
    list.appendChild(li);
  });
  totalEl.textContent = total.toFixed(2);
}

// real-time updates
db.ref('donations').on('value', renderDonors);

// also fetch when page becomes visible (no manual refresh needed)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    db.ref('donations').once('value').then(renderDonors);
  }
});
