<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad Donation Tracker</title>
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    flex-direction: column;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  h1 {
    text-align: center;
    color: #2a7ae2;
  }

  .container {
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  }

  input {
    width: calc(50% - 10px);
    padding: 10px;
    margin: 5px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
    background: #2a7ae2;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #1954b3;
  }

  ul {
    list-style: none;
    padding-left: 0;
  }

  li {
    background: #f1f3f5;
    margin: 5px 0;
    padding: 10px;
    border-radius: 6px;
  }

  .total {
    font-weight: bold;
    margin-top: 15px;
    text-align: center;
    font-size: 18px;
    color: #2a7ae2;
  }
</style>
</head>
<body>
  <h1>iPad Donation Tracker</h1>
  <div class="container">
    <input id="name" placeholder="Your Name">
    <input id="amount" placeholder="Minimum $50" type="number" min="50" step="1">
    <button onclick="submitDonation()">Donate</button>

    <h2>Donors:</h2>
    <ul id="donorList"></ul>

    <div class="total">Total Raised: $<span id="totalAmount">0</span></div>
  </div>

<script>
  // 🔹 Paste your Firebase config here
 const firebaseConfig = {
  apiKey: "AIzaSyCYUn-Jtn3fn-FQ9PRn_-9DmbGNDqM20kM",
  authDomain: "ipad-donation-db.firebaseapp.com",
  databaseURL: "https://ipad-donation-db-default-rtdb.firebaseio.com",
  projectId: "ipad-donation-db",
  storageBucket: "ipad-donation-db.firebasestorage.app",
  messagingSenderId: "799475714157",
  appId: "1:799475714157:web:7739a88ed8b20c09a31764"
};

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Submit donation
function submitDonation() {
  const name = document.getElementById('name').value.trim();
  const amountInput = document.getElementById('amount').value.trim();

  if (!name) {
    alert("Please enter your name.");
    return;
  }

  if (!/^\d+(\.\d+)?$/.test(amountInput)) {
    alert("Amount must be numbers only.");
    return;
  }

  const amount = parseFloat(amountInput);

  if (amount < 50) {
    alert("Please only $50 and above allowed.");
    return;
  }

  db.ref('donations').push({ name, amount });

  document.getElementById('name').value = '';
  document.getElementById('amount').value = '';
}

  // Load donors
  db.ref('donations').on('value', snapshot => {
    const list = document.getElementById('donorList');
    const totalEl = document.getElementById('totalAmount');
    let total = 0;
    list.innerHTML = '';
    snapshot.forEach(child => {
      const val = child.val();
      total += parseFloat(val.amount);
      const li = document.createElement('li');
      li.textContent = `${val.name} will donate $${val.amount}`;
      list.appendChild(li);
    });
    totalEl.textContent = total.toFixed(2);
  });
</script>
</body>

</html>
